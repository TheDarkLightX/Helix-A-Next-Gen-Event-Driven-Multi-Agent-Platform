name: Agent diagnose capability selection

on:
  push:
    branches:
      - agent/deterministic-capability-selection
    paths-ignore:
      - .agent-ci-diagnostics/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply narrow lint fix and capture bounded diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-ci-diagnostics

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/helix-core/src/deterministic_capability_selection.rs")
          source = path.read_text()
          old = """fn validate_catalog<'a>(
              catalog: &'a [CapabilityDescriptor],
          ) -> Result<BTreeMap<String, &'a CapabilityDescriptor>, CapabilitySelectionError> {
          """
          new = """fn validate_catalog(
              catalog: &[CapabilityDescriptor],
          ) -> Result<BTreeMap<String, &CapabilityDescriptor>, CapabilitySelectionError> {
          """
          if old not in source:
              raise SystemExit("expected validate_catalog signature not found")
          path.write_text(source.replace(old, new, 1))
          PY

          cargo fmt --manifest-path crates/helix-core/Cargo.toml

          set +e
          cargo test --manifest-path crates/helix-core/Cargo.toml \
            > .agent-ci-diagnostics/helix-core-test.full.log 2>&1
          core_status=$?
          cargo test --manifest-path crates/helix-api/Cargo.toml \
            > .agent-ci-diagnostics/helix-api-test.full.log 2>&1
          api_status=$?
          cargo clippy --manifest-path crates/helix-core/Cargo.toml --all-targets -- -D warnings \
            > .agent-ci-diagnostics/helix-core-clippy.full.log 2>&1
          clippy_status=$?
          set -e

          tail -n 240 .agent-ci-diagnostics/helix-core-test.full.log \
            > .agent-ci-diagnostics/helix-core-test.txt
          tail -n 240 .agent-ci-diagnostics/helix-api-test.full.log \
            > .agent-ci-diagnostics/helix-api-test.txt
          tail -n 240 .agent-ci-diagnostics/helix-core-clippy.full.log \
            > .agent-ci-diagnostics/helix-core-clippy.txt
          rm .agent-ci-diagnostics/*.full.log

          printf 'helix_core_test=%s\nhelix_api_test=%s\nhelix_core_clippy=%s\n' \
            "$core_status" "$api_status" "$clippy_status" \
            > .agent-ci-diagnostics/status.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/helix-core/src .agent-ci-diagnostics/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture capability-selection diagnostics"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
