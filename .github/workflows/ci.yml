name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  HELIX_ESSO_REF: 1145cf77668b6d86cda83d79820b13a65fbde12f
  HELIX_FORMAL_MODULE: ESSO
  HELIX_FORMAL_PYTHONPATH: external/ESSO

permissions:
  contents: write

jobs:
  wasm-sandbox-diagnostics:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/wasm-sandbox-enforcement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Capture focused WASM diagnostics and restore CI
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-wasm-focused
          cargo fmt --manifest-path crates/helix-wasm/Cargo.toml

          set +e
          cargo test --manifest-path crates/helix-wasm/Cargo.toml \
            > .agent-wasm-focused/test.full.txt 2>&1
          test_status=$?
          cargo clippy --manifest-path crates/helix-wasm/Cargo.toml --lib --no-deps -- -D warnings -A missing-docs \
            > .agent-wasm-focused/clippy.full.txt 2>&1
          clippy_status=$?
          set -e

          tail -n 360 .agent-wasm-focused/test.full.txt > .agent-wasm-focused/test.txt
          tail -n 360 .agent-wasm-focused/clippy.full.txt > .agent-wasm-focused/clippy.txt
          rm .agent-wasm-focused/*.full.txt
          printf 'test=%s\nclippy=%s\n' "$test_status" "$clippy_status" \
            > .agent-wasm-focused/status.txt

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/helix-wasm .github/workflows/ci.yml .agent-wasm-focused
          git commit -m "Capture focused WASM sandbox diagnostics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  release-gates:
    name: Release gates
    runs-on: ubuntu-latest
    env:
      ESSO_READ_TOKEN_PRESENT: ${{ secrets.ESSO_READ_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            helix-ts-sdk/package-lock.json

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Require ESSO verifier token
        if: github.event_name != 'pull_request' && env.ESSO_READ_TOKEN_PRESENT != 'true'
        shell: bash
        run: |
          echo "::error::ESSO_READ_TOKEN is required for release verification outside pull requests."
          exit 1

      - name: Checkout ESSO verifier
        if: env.ESSO_READ_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: TheDarkLightX/ESSO
          ref: ${{ env.HELIX_ESSO_REF }}
          path: external/ESSO
          token: ${{ secrets.ESSO_READ_TOKEN }}
          persist-credentials: false

      - name: Install ESSO verifier
        if: env.ESSO_READ_TOKEN_PRESENT == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -e external/ESSO

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ui
          if [[ -f helix-ts-sdk/package-lock.json ]]; then
            npm ci --prefix helix-ts-sdk
          else
            npm install --prefix helix-ts-sdk
          fi

      - name: Run release verification
        if: env.ESSO_READ_TOKEN_PRESENT == 'true'
        shell: bash
        run: bash scripts/verify_release.sh

      - name: Run PR verification without private ESSO
        if: github.event_name == 'pull_request' && env.ESSO_READ_TOKEN_PRESENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::ESSO_READ_TOKEN is not configured; skipping private ESSO-backed formal verification for this pull request."
          cargo test --manifest-path crates/helix-core/Cargo.toml
          cargo test --manifest-path crates/helix-api/Cargo.toml
          (
            cd formal/lean
            lake build
          )
          (
            cd ui
            npm run build
          )
          (
            cd helix-ts-sdk
            npm run asbuild
            npm test
          )
