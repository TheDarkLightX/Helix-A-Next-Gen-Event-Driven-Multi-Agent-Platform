name: Agent harden VM sandbox

on:
  push:
    branches:
      - agent/policy-bound-vm-sandbox
    paths-ignore:
      - .agent-ci-diagnostics/**

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Harden runtime profile binding and validate
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-ci-diagnostics

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/helix-core/src/sandbox_execution.rs")
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f"expected {label} snippet not found")

          replace_once(
              'const POLICY_HASH_DOMAIN_V1: &[u8] = b"helix:sandbox-policy:v1";\n',
              'const POLICY_HASH_DOMAIN_V1: &[u8] = b"helix:sandbox-policy:v1";\n'
              'const RUNTIME_PROFILE_HASH_DOMAIN_V1: &[u8] = b"helix:sandbox-runtime-profile:v1";\n',
              "runtime profile domain",
          )

          replace_once(
              '    /// Non-zero anti-replay nonce committed into the plan.\n'
              '    pub execution_nonce: SandboxDigest,\n',
              '    /// Non-zero replay identity committed into the plan. Uniqueness is enforced\n'
              '    /// by the external anti-replay store or MPRD execution boundary.\n'
              '    pub execution_nonce: SandboxDigest,\n',
              "nonce documentation",
          )

          replace_once(
              '    /// Runtime families permitted by this policy.\n'
              '    pub allowed_backends: BTreeSet<SandboxBackend>,\n'
              '    /// Exact approved runtime/VMM configuration commitments.\n',
              '    /// Runtime families permitted by this policy.\n'
              '    pub allowed_backends: BTreeSet<SandboxBackend>,\n'
              '    /// Exact approved `(backend, runtime, kernel, rootfs)` tuple commitments.\n'
              '    /// This prevents individually approved artifacts from being recombined into an\n'
              '    /// unreviewed runtime profile.\n'
              '    pub allowed_runtime_profile_digests: BTreeSet<SandboxDigest>,\n'
              '    /// Exact approved runtime/VMM configuration commitments.\n',
              "policy runtime profile field",
          )

          replace_once(
              '    /// Runtime configuration commitment is not approved.\n'
              '    #[error("sandbox runtime digest is not allowlisted")]\n'
              '    RuntimeDigestDenied,\n',
              '    /// The exact backend/runtime/kernel/rootfs tuple is not approved.\n'
              '    #[error("sandbox runtime profile is not allowlisted")]\n'
              '    RuntimeProfileDenied,\n'
              '    /// Runtime configuration commitment is not approved.\n'
              '    #[error("sandbox runtime digest is not allowlisted")]\n'
              '    RuntimeDigestDenied,\n',
              "runtime profile error",
          )

          replace_once(
              '    if !policy.allowed_rootfs_digests.contains(&request.rootfs_digest) {\n'
              '        return Err(SandboxExecutionError::RootfsDigestDenied);\n'
              '    }\n\n'
              '    validate_identifier(\n',
              '    if !policy.allowed_rootfs_digests.contains(&request.rootfs_digest) {\n'
              '        return Err(SandboxExecutionError::RootfsDigestDenied);\n'
              '    }\n'
              '    let runtime_profile_digest = sandbox_runtime_profile_digest(\n'
              '        request.backend,\n'
              '        &request.runtime_digest,\n'
              '        &request.kernel_digest,\n'
              '        &request.rootfs_digest,\n'
              '    );\n'
              '    if !policy\n'
              '        .allowed_runtime_profile_digests\n'
              '        .contains(&runtime_profile_digest)\n'
              '    {\n'
              '        return Err(SandboxExecutionError::RuntimeProfileDenied);\n'
              '    }\n\n'
              '    validate_identifier(\n',
              "runtime profile admission",
          )

          replace_once(
              '/// Compute the canonical commitment to a validated sandbox policy.\n'
              'pub fn sandbox_policy_hash(\n',
              '/// Commit to one exact reviewed runtime tuple.\n'
              '#[must_use]\n'
              'pub fn sandbox_runtime_profile_digest(\n'
              '    backend: SandboxBackend,\n'
              '    runtime_digest: &SandboxDigest,\n'
              '    kernel_digest: &SandboxDigest,\n'
              '    rootfs_digest: &SandboxDigest,\n'
              ') -> SandboxDigest {\n'
              '    let mut hasher = Sha256::new();\n'
              '    hasher.update(RUNTIME_PROFILE_HASH_DOMAIN_V1);\n'
              '    hasher.update([backend.tag()]);\n'
              '    hash_digest(&mut hasher, runtime_digest);\n'
              '    hash_digest(&mut hasher, kernel_digest);\n'
              '    hash_digest(&mut hasher, rootfs_digest);\n'
              '    SandboxDigest(hasher.finalize().into())\n'
              '}\n\n'
              '/// Compute the canonical commitment to a validated sandbox policy.\n'
              'pub fn sandbox_policy_hash(\n',
              "runtime profile digest function",
          )

          replace_once(
              '    if policy.allowed_backends.is_empty() {\n'
              '        return Err(SandboxExecutionError::InvalidPolicy(\n'
              '            "allowed_backends must not be empty".to_string(),\n'
              '        ));\n'
              '    }\n'
              '    validate_digest_allowlist(\n'
              '        "allowed_runtime_digests",\n',
              '    if policy.allowed_backends.is_empty() {\n'
              '        return Err(SandboxExecutionError::InvalidPolicy(\n'
              '            "allowed_backends must not be empty".to_string(),\n'
              '        ));\n'
              '    }\n'
              '    validate_digest_allowlist(\n'
              '        "allowed_runtime_profile_digests",\n'
              '        &policy.allowed_runtime_profile_digests,\n'
              '    )?;\n'
              '    validate_digest_allowlist(\n'
              '        "allowed_runtime_digests",\n',
              "runtime profile policy validation",
          )

          replace_once(
              '    if path.len() > 1 && path.ends_with(\'/\') {\n',
              '    if path == "/" {\n'
              '        return if allow_root {\n'
              '            Ok(())\n'
              '        } else {\n'
              '            Err(SandboxExecutionError::InvalidGuestPath {\n'
              '                field,\n'
              '                path: path.to_string(),\n'
              '            })\n'
              '        };\n'
              '    }\n'
              '    if path.ends_with(\'/\') {\n',
              "root path handling",
          )

          replace_once(
              '    for backend in &policy.allowed_backends {\n'
              '        hasher.update([backend.tag()]);\n'
              '    }\n'
              '    hash_digest_set(&mut hasher, &policy.allowed_runtime_digests);\n',
              '    for backend in &policy.allowed_backends {\n'
              '        hasher.update([backend.tag()]);\n'
              '    }\n'
              '    hash_digest_set(\n'
              '        &mut hasher,\n'
              '        &policy.allowed_runtime_profile_digests,\n'
              '    );\n'
              '    hash_digest_set(&mut hasher, &policy.allowed_runtime_digests);\n',
              "runtime profile policy hash",
          )

          replace_once(
              '            allowed_backends: BTreeSet::from([SandboxBackend::Firecracker]),\n'
              '            allowed_runtime_digests: BTreeSet::from([digest(1)]),\n',
              '            allowed_backends: BTreeSet::from([SandboxBackend::Firecracker]),\n'
              '            allowed_runtime_profile_digests: BTreeSet::from([\n'
              '                sandbox_runtime_profile_digest(\n'
              '                    SandboxBackend::Firecracker,\n'
              '                    &digest(1),\n'
              '                    &digest(2),\n'
              '                    &digest(3),\n'
              '                ),\n'
              '            ]),\n'
              '            allowed_runtime_digests: BTreeSet::from([digest(1)]),\n',
              "test policy runtime profile",
          )

          replace_once(
              '    #[test]\n'
              '    fn unapproved_runtime_is_rejected() {\n',
              '    #[test]\n'
              '    fn individually_approved_runtime_artifacts_cannot_be_recombined() {\n'
              '        let mut policy = policy();\n'
              '        policy.allowed_runtime_digests.insert(digest(31));\n'
              '        policy.allowed_kernel_digests.insert(digest(32));\n'
              '        policy.allowed_rootfs_digests.insert(digest(33));\n'
              '        policy.allowed_runtime_profile_digests.insert(\n'
              '            sandbox_runtime_profile_digest(\n'
              '                SandboxBackend::Firecracker,\n'
              '                &digest(31),\n'
              '                &digest(32),\n'
              '                &digest(33),\n'
              '            ),\n'
              '        );\n'
              '        let mut mixed = request();\n'
              '        mixed.runtime_digest = digest(31);\n'
              '        assert_eq!(\n'
              '            admit_sandbox_execution(&policy, mixed),\n'
              '            Err(SandboxExecutionError::RuntimeProfileDenied)\n'
              '        );\n'
              '    }\n\n'
              '    #[test]\n'
              '    fn root_working_directory_is_canonical() {\n'
              '        let mut root = request();\n'
              '        root.working_dir = "/".to_string();\n'
              '        admit_sandbox_execution(&policy(), root).expect("root working directory");\n'
              '    }\n\n'
              '    #[test]\n'
              '    fn unapproved_runtime_is_rejected() {\n',
              "runtime profile and root tests",
          )

          path.write_text(source)
          PY

          cargo fmt --manifest-path crates/helix-core/Cargo.toml

          set +e
          cargo test --manifest-path crates/helix-core/Cargo.toml sandbox_execution \
            > .agent-ci-diagnostics/vm-sandbox-test.full.log 2>&1
          test_status=$?
          cargo clippy --manifest-path crates/helix-core/Cargo.toml --all-targets -- -D warnings \
            > .agent-ci-diagnostics/vm-sandbox-clippy.full.log 2>&1
          clippy_status=$?
          set -e

          tail -n 320 .agent-ci-diagnostics/vm-sandbox-test.full.log \
            > .agent-ci-diagnostics/vm-sandbox-test.txt
          tail -n 320 .agent-ci-diagnostics/vm-sandbox-clippy.full.log \
            > .agent-ci-diagnostics/vm-sandbox-clippy.txt
          rm .agent-ci-diagnostics/*.full.log
          printf 'sandbox_test=%s\nsandbox_clippy=%s\n' \
            "$test_status" "$clippy_status" \
            > .agent-ci-diagnostics/status.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/helix-core/src/sandbox_execution.rs .agent-ci-diagnostics/*.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: bind VM sandbox runtime profiles atomically"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
