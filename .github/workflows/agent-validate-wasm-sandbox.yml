name: Agent validate WASM sandbox

on:
  push:
    branches:
      - agent/wasm-sandbox-enforcement
    paths-ignore:
      - .agent-wasm-diagnostics/**

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, test, and capture bounded diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .agent-wasm-diagnostics
          cargo fmt --manifest-path crates/helix-wasm/Cargo.toml

          set +e
          cargo test --manifest-path crates/helix-wasm/Cargo.toml \
            > .agent-wasm-diagnostics/test.full.txt 2>&1
          test_status=$?
          cargo clippy --manifest-path crates/helix-wasm/Cargo.toml --all-targets -- -D warnings \
            > .agent-wasm-diagnostics/clippy.full.txt 2>&1
          clippy_status=$?
          set -e

          tail -n 320 .agent-wasm-diagnostics/test.full.txt > .agent-wasm-diagnostics/test.txt
          tail -n 320 .agent-wasm-diagnostics/clippy.full.txt > .agent-wasm-diagnostics/clippy.txt
          rm .agent-wasm-diagnostics/*.full.txt
          printf 'test=%s\nclippy=%s\n' "$test_status" "$clippy_status" \
            > .agent-wasm-diagnostics/status.txt

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/helix-wasm/src .agent-wasm-diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "Validate WASM sandbox enforcement"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
