name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - label: darwin-x64
            os: macos-13
            target: x86_64-apple-darwin
          - label: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - label: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install arm64 cross-compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ui
          npm run --prefix ui build

      - name: Build API binary
        shell: bash
        env:
          SQLX_OFFLINE: "true"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [[ -n "${{ matrix.cross }}" ]]; then
            cargo build --release -p helix-api --target ${{ matrix.target }}
          else
            cargo build --release -p helix-api
          fi

      - name: Smoke-test binary
        if: matrix.cross != true
        shell: bash
        run: |
          exe="target/release/helix-api"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            exe="target/release/helix-api.exe"
          fi
          "$exe" --version
          "$exe" --help

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail

          # Determine OS and arch from the matrix label
          label="${{ matrix.label }}"
          os="${label%%-*}"
          arch="${label##*-}"

          case "$os" in
            linux)   os_name="linux" ;;
            darwin)  os_name="darwin" ;;
            windows) os_name="windows" ;;
            *) echo "unsupported os: $os" >&2; exit 1 ;;
          esac

          exe=""
          if [[ "$os_name" == "windows" ]]; then
            exe=".exe"
          fi

          # Binary location: target/release/ for native, target/<target>/release/ for cross
          if [[ -n "${{ matrix.cross }}" ]]; then
            bin_dir="target/${{ matrix.target }}/release"
          else
            bin_dir="target/release"
          fi

          suffix="${os_name}-${arch}"
          archive="helix-api-${suffix}.tar.gz"
          staging="target/release-package/helix-api-${suffix}"
          rm -rf "$staging"
          mkdir -p "$staging/bin" "$staging/ui"

          cp "${bin_dir}/helix-api${exe}" "$staging/bin/"
          if [[ "$os_name" == "windows" ]]; then
            cat > "$staging/bin/helix.cmd" <<'EOF'
@echo off
if "%HELIX_UI_DIST%"=="" set "HELIX_UI_DIST=%~dp0..\ui\dist"
"%~dp0helix-api.exe" %*
EOF
          else
            cat > "$staging/bin/helix" <<'EOF'
#!/usr/bin/env bash
set -euo pipefail
SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
if [[ -z "${HELIX_UI_DIST:-}" ]]; then
  export HELIX_UI_DIST="$(cd "$SCRIPT_DIR/../ui/dist" && pwd)"
fi
exec "$SCRIPT_DIR/helix-api" "$@"
EOF
            chmod 0755 "$staging/bin/helix"
          fi
          cp -R ui/dist "$staging/ui/dist"
          cp README.md LICENSE "$staging/"
          if [[ -f COMPLETION_SCOPE.md ]]; then
            cp COMPLETION_SCOPE.md "$staging/"
          fi

          tar -czf "$archive" -C "target/release-package" "helix-api-${suffix}"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: package

    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
